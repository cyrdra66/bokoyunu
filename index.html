<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>ilayda Yemek Arıyor</title>
<style>
    body {
        margin: 0;
        background: #ffe7f0;
        font-family: Arial;
        overflow: hidden;
    }

    #game {
        width: 100vw;
        height: 100vh;
        position: relative;
        background: linear-gradient(#ffd6e8, #fff);
    }

    #startMenu {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: white;
        font-size: 40px;
        z-index: 10;
    }

    #startBtn {
        padding: 20px 50px;
        background: #ff2e7a;
        color: white;
        font-size: 35px;
        border-radius: 20px;
        cursor: pointer;
        margin-top: 20px;
        border: 3px solid #fff;
    }

    /* Patlama efekti */
    #explosion {
        position: absolute;
        width: 120px;
        height: 120px;
        background: radial-gradient(circle, rgba(255,0,0,1), rgba(255,0,0,0));
        border-radius: 50%;
        pointer-events: none;
        display: none;
        z-index: 8;
    }

    /* Dilan karakteri */
    #dilan {
        width: 70px;
        height: 70px;
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
    }

    #dilan img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 50%;
        box-shadow: 0 0 10px #ff69a6;
    }

    /* Düşen nesneler */
    .falling {
        width: 55px;
        height: 55px;
        position: absolute;
        top: -60px;
    }

    .falling img {
        width: 100%;
        height: 100%;
    }

    #score, #lives, #magnetTimer {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 24px;
        color: #c4004f;
        font-weight: bold;
    }

    #lives { top: 45px; color: #7a0030; }
    #magnetTimer { top: 80px; color: #005; }

    #gameover {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 50px;
        color: #b30000;
        font-weight: bold;
        display: none;
    }
</style>
</head>
<body>

<div id="game">

    <!-- Başlangıç menüsü -->
    <div id="startMenu">
        <div>🍽️ İlayda Yemek Arıyor</div>
        <div id="startBtn">BAŞLA</div>
    </div>

    <!-- Patlama efekti -->
    <div id="explosion"></div>

    <!-- Skor, can ve mıknatıs süresi -->
    <div id="score">Puan: 0</div>
    <div id="lives">Can: 3</div>
    <div id="magnetTimer"></div>

    <!-- Game Over -->
    <div id="gameover">GAME OVER 💔</div>

    <!-- ilayda karakteri -->
    <div id="dilan">
        <img src="dilan.png" alt="Dilan">
    </div>

</div>

<script>
    const startMenu = document.getElementById("startMenu");
    const startBtn = document.getElementById("startBtn");

    const explosion = document.getElementById("explosion");

    const dilan = document.getElementById("dilan");
    const game = document.getElementById("game");

    const scoreText = document.getElementById("score");
    const livesText = document.getElementById("lives");
    const magnetTimerText = document.getElementById("magnetTimer");

    const gameOver = document.getElementById("gameover");

    const foodImages = ["yemek1.png", "yemek2.png", "yemek3.png"];

    let score = 0;
    let lives = 3;
    let gameRunning = false;

    let dilanX = window.innerWidth / 2;

    let magnetActive = false;
    let magnetTime = 0;

    startBtn.onclick = () => {
        startMenu.style.display = "none";
        gameRunning = true;
    };

    // Hareket
    document.addEventListener("keydown", (e) => {
        if (!gameRunning) return;

        if (e.key === "ArrowLeft") dilanX -= 30;
        if (e.key === "ArrowRight") dilanX += 30;

        if (dilanX < 0) dilanX = 0;
        if (dilanX > window.innerWidth - 70)
            dilanX = window.innerWidth - 70;

        dilan.style.left = dilanX + "px";
    });

    // Patlama göster
    function showExplosion(x, y) {
        explosion.style.left = x - 40 + "px";
        explosion.style.top = y - 40 + "px";
        explosion.style.display = "block";

        setTimeout(() => {
            explosion.style.display = "none";
        }, 200);
    }

    function spawnObject() {
        if (!gameRunning) return;

        const obj = document.createElement("div");
        obj.classList.add("falling");

        let objType = "food";

        // %5 mıknatıs 🧲
        if (Math.random() < 0.05) {
            obj.innerHTML = `<span style="font-size:50px;position:absolute;top:-5px;left:0;">🧲</span>`;
            objType = "magnet";
        }
        // %25 pislik 💩
        else if (Math.random() < 0.25) {
            obj.innerHTML = `<span style="font-size:50px;position:absolute;top:-5px;left:0;">💩</span>`;
            objType = "poop";
        }
        else {
            const img = foodImages[Math.floor(Math.random() * foodImages.length)];
            obj.innerHTML = `<img src="${img}">`;
        }

        obj.type = objType;

        obj.style.left = Math.random() * (window.innerWidth - 55) + "px";
        game.appendChild(obj);

        let fall = setInterval(() => {
            if (!gameRunning) {
                obj.remove();
                clearInterval(fall);
                return;
            }

            obj.style.top = (obj.offsetTop + 5) + "px";

            // Mıknatıs aktifse yemekler otomatik yenilsin
            if (magnetActive && obj.type === "food") {
                if (obj.offsetTop > window.innerHeight - 200) {
                    score++;
                    scoreText.textContent = "Puan: " + score;
                    obj.remove();
                    clearInterval(fall);
                    return;
                }
            }

            // Çarpışma
            if (
                obj.offsetTop + 55 >= window.innerHeight - 100 &&
                obj.offsetLeft > dilanX - 55 &&
                obj.offsetLeft < dilanX + 70
            ) {
                if (obj.type === "poop") {
                    lives--;
                    livesText.textContent = "Can: " + lives;

                    // Patlama
                    showExplosion(dilanX, window.innerHeight - 80);

                    if (lives <= 0) {
                        gameRunning = false;
                        gameOver.style.display = "block";
                    }
                }
                else if (obj.type === "magnet") {
                    magnetActive = true;
                    magnetTime = 10;
                }
                else {
                    score++;
                    scoreText.textContent = "Puan: " + score;
                }

                obj.remove();
                clearInterval(fall);
            }

            if (obj.offsetTop > window.innerHeight) {
                obj.remove();
                clearInterval(fall);
            }
        }, 20);
    }

    // Mıknatıs süresi
    setInterval(() => {
        if (magnetActive) {
            magnetTime--;
            magnetTimerText.textContent = "Mıknatıs: " + magnetTime;

            if (magnetTime <= 0) {
                magnetActive = false;
                magnetTimerText.textContent = "";
            }
        }
    }, 1000);

    // Nesneleri sürekli üret
    setInterval(spawnObject, 900);
</script>

</body>
</html>
